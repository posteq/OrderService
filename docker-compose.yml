services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSRGERS_UESER: postgres
      POSTGRES_PASSWORD: demo
    ports:
      - "5557:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"

volumes:
  order-pgdata: